<style>
@font-face{font-family:'Atkinson Hyperlegible';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2')}
/* Layout: one phone-width column of plain cards and rows, a labelled bottom tab bar, bottom sheets for forms.

:root{

  --scrim:rgba(5,15,16,.55);

    --accent:#6FD0C6;--accent-ink:#06201E;--accent-soft:#17383A;
    --hot:#FF9A90;--hot-soft:#3D1A17;--warm:#F3C07A;--warm-soft:#35280F;--good:#86DBA6;--good-soft:#15331F;
    --c1:#6FD0C6;--c2:#E7A93B;--c3:#7C9BE3;--c4:#E083A8;--c5:#93C46F;--c6:#B095DB;--c7:#8DA0A2;
    --scrim:rgba(0,0,0,.65);--shadow:0 2px 8px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{

  --accent:#6FD0C6;--accent-ink:#06201E;--accent-soft:#17383A;

  --c1:#6FD0C6;--c2:#E7A93B;--c3:#7C9BE3;--c4:#E083A8;--c5:#93C46F;--c6:#B095DB;--c7:#8DA0A2;

}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{font-size:100%}

.icon-btn:hover{background:var(--surface-2)}
main{padding-top:4px;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}

.when{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}

.cnt{display:inline-block;min-width:64px;padding:4px 10px;border-radius:8px;font:700 .875rem var(--f-body);text-align:center;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.cnt.warm{background:var(--warm-soft);color:var(--warm);border-color:transparent}

.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.875rem;font-weight:700;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

.clear{padding:16px;border-radius:14px;border:1px dashed var(--line-strong);color:var(--ink-2);font-size:1.0625rem}

.ticket{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}

.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-weight:700;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.fab{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}

.tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:56px;border-radius:12px;font-size:.8125rem;font-weight:700;color:var(--ink-2);position:relative;text-align:center}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .tab-i{background:var(--accent-soft)}
.tab-i{width:48px;height:28px;border-radius:14px;display:grid;place-items:center}
.badge{position:absolute;top:2px;right:calc(50% - 28px);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--hot);color:#fff;font:700 .75rem/20px var(--f-body);text-align:center}

.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{display:flex;flex-direction:column;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;background:var(--surface);border-radius:18px 18px 0 0;overflow:hidden;box-shadow:var(--shadow)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 8px 4px max(16px,env(safe-area-inset-left,0px))}
.sheet-head h2{font:700 1.375rem var(--f-body)}
.sheet form{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.sheet-body{overflow-y:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;flex:1 1 auto;min-height:0}
.sheet-foot{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.sheet-foot:empty{display:none}
.sheet-foot .btn{flex:1}

.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lbl{font-size:1rem;font-weight:700;color:var(--ink)}
.req{font-weight:400;color:var(--muted)}
.fld-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
input,select,textarea{font:1.0625rem var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px;padding:0 12px;min-height:50px;width:100%;min-width:0}
input[type="date"],input[type="time"]{min-height:50px}
textarea{padding:12px;resize:vertical;line-height:1.45}
input[type="checkbox"]{width:26px;height:26px;min-height:0;padding:0;accent-color:var(--accent)}
.tog{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--ink);min-height:48px}
.files{display:flex;flex-direction:column;gap:8px}
.file-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.thumb{width:48px;height:48px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

.rm:hover{background:var(--hot-soft);color:var(--hot)}

.idcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.idc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.idc-cat{display:inline-flex;align-items:center;gap:6px;font:700 1rem var(--f-body);color:var(--accent)}
.idcard h3{font:700 1.25rem/1.3 var(--f-body);overflow-wrap:anywhere}

.idc-foot{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;font-size:.9375rem;color:var(--muted)}

.lnk{display:inline-flex;align-items:center;gap:5px;font-size:1rem;font-weight:700;color:var(--accent);text-decoration:none;padding:6px 0}

.big{font:700 2.5rem/1.1 var(--f-body);font-variant-numeric:tabular-nums}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:12px}

.legend i{width:14px;height:14px;border-radius:4px;display:block}

.calhead{display:flex;align-items:center;justify-content:space-between}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font:700 .875rem var(--f-body);color:var(--ink-2);text-align:center;padding:4px 0}
.day{min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:1.0625rem;font-variant-numeric:tabular-nums}
.day.blank{border:0;background:none}
.day.today{border:2px solid var(--accent);color:var(--accent)}

.dots{display:flex;gap:3px;height:6px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.tile b{font:700 1.125rem var(--f-body)}
.tile span.sub{margin-top:-6px}

.chk{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:4px;padding:2px 10px 2px 2px;border-top:1px solid var(--line);min-height:56px}
.chk:first-child{border-top:0}
.chk button.box{width:48px;height:48px;display:grid;place-items:center}
.box i{width:26px;height:26px;border-radius:7px;border:2px solid var(--line-strong);display:grid;place-items:center;color:var(--accent-ink)}
.chk.done .box i{background:var(--accent);border-color:var(--accent)}
.chk.done .ttl{text-decoration:line-through;color:var(--muted)}
.chk .ttl{display:flex;flex-direction:column;text-align:left;min-width:0;padding:8px 0}
.chk .ttl span{overflow-wrap:anywhere}

.kv dt{color:var(--ink-2);font-size:1rem}
.kv dd{margin:0;overflow-wrap:anywhere}

.empty h3{font:700 1.25rem/1.3 var(--f-body)}
.empty p{color:var(--ink-2);font-size:1.0625rem}
.empty-a{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.addbar{display:flex;gap:8px}
.addbar input{flex:1}
.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:min(92vw,420px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:1rem;font-weight:700;box-shadow:var(--shadow);text-align:center}
.sk{height:64px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){
  .scrim{animation:fade .15s ease-out}
  .sheet{animation:rise .2s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{transform:translateY(24px)}to{transform:none}}
}
</style>

<header class="top"><div class="wrap top-in">
  <div class="brand"><span>Percy</span><small id="todayLabel"></small></div>
  <button class="icon-btn" data-act="search" aria-label="Search everything" id="searchBtn"></button>
</div></header>

</div>

<script>
/* Percy standalone shim: gives the page the same "claude.use(...)" capabilities it had as an artifact.
   Two modes:
   - native (Capacitor Android app): files in Documents/Percy/<trip>/
   - pwa (installed from the browser, iPhone or Android): files in the browser's own storage (IndexedDB)
   Reading confirmations uses the user's own Anthropic API key in both. */
(function(){
  var C=window.Capacitor;
  var NATIVE=!!(C&&C.isNativePlatform&&C.isNativePlatform());
  window.PERCY_NATIVE=true;window.PERCY_MODE=NATIVE?'native':'pwa';
  function san(s){return String(s||'').replace(/[\\\/:*?"<>|\u0000-\u001f]+/g,' ').replace(/\s+/g,' ').trim().slice(0,60);}
  function rid(){var a=new Uint8Array(16);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2);}).join('');}
  function b64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1]||'');};r.onerror=function(){rej(r.error);};r.readAsDataURL(blob);});}
  function fromB64(d,type){var bin=atob(d),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:type||'application/octet-stream'});}
  var urlCache={},assets,downloads,blobUrl;
  window.PercyNative={};

  if(NATIVE){
    var FS=C.registerPlugin('Filesystem'),Opener=C.registerPlugin('FileOpener');
    var KEY='percy.files',idx={};
    try{idx=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){idx={};}
    var saveIdx=function(){try{localStorage.setItem(KEY,JSON.stringify(idx));}catch(e){}};
    var permAsked=false;
    var ensurePerm=async function(){if(permAsked)return;permAsked=true;try{await FS.requestPermissions();}catch(e){}};
    var writeTo=async function(rel,data,enc){
      await ensurePerm();
      var dirs=['DOCUMENTS','DATA'],last=null;
      for(var i=0;i<dirs.length;i++){
        try{var o={path:rel,data:data,directory:dirs[i],recursive:true};if(enc)o.encoding=enc;await FS.writeFile(o);return dirs[i];}catch(e){last=e;}
      }
      throw last||new Error('write');
    };
    assets={
      upload:async function(file,o){
        o=o||{};
        var folder=san(o.folder)||'Other',name=san(file.name)||'file';
        var dot=name.lastIndexOf('.'),base=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';
        var used={};Object.keys(idx).forEach(function(k){used[idx[k].path]=1;});
        var rel='Percy/'+folder+'/'+name,n=2;
        while(used[rel]){rel='Percy/'+folder+'/'+base+' ('+n+')'+ext;n++;}
        var data=await b64(file),dir;
        try{dir=await writeTo(rel,data);}catch(e){throw {code:'quota_or_state',message:String(e&&e.message||e)};}
        var id=rid(),type=o.type||file.type||'application/octet-stream';
        idx[id]={dir:dir,path:rel,type:type};saveIdx();
        return {id:id,contentType:type,sizeBytes:file.size};
      },
      delete:async function(id){
        var m=idx[id];if(!m)return;
        try{await FS.deleteFile({path:m.path,directory:m.dir});}catch(e){}
        delete idx[id];saveIdx();
      }
    };
    blobUrl=async function(id){
      if(urlCache[id])return urlCache[id];
      var m=idx[id];if(!m)throw new Error('missing');
      var r=await FS.readFile({path:m.path,directory:m.dir});
      return (urlCache[id]=URL.createObjectURL(fromB64(r.data,m.type)));
    };
    window.PercyNative.open=async function(id,type){
      var m=idx[id];
      if(!m){alert('This file is not on this phone any more.');return;}
      try{
        var u=await FS.getUri({path:m.path,directory:m.dir});
        await Opener.open({filePath:u.uri,contentType:m.type||type||'application/pdf'});
      }catch(e){
        try{window.open(await blobUrl(id),'_blank');}catch(e2){alert('Could not open this file. Look for it in your Files app under Documents, Percy.');}
      }
    };
    downloads={
      save:async function(req){
        var data=req.data,isStr=typeof data==='string';
        var payload=isStr?data:await b64(data instanceof Blob?data:new Blob([data]));
        var dir=await writeTo('Percy/Backups/'+(san(req.filename)||'percy-file'),payload,isStr?'utf8':undefined);
        return {status:'saved',where:(dir==='DOCUMENTS'?'Documents':'the Percy app')+' › Percy › Backups'};
      }
    };
  }else{
    /* PWA: IndexedDB */
    var dbp=null;
    var idb=function(){
      if(dbp)return dbp;
      dbp=new Promise(function(res,rej){
        var q=indexedDB.open('percy-files',1);
        q.onupgradeneeded=function(){q.result.createObjectStore('f');};
        q.onsuccess=function(){res(q.result);};
        q.onerror=function(){dbp=null;rej(q.error);};
      });
      return dbp;
    };
    var tx=function(mode,fn){
      return idb().then(function(db){return new Promise(function(res,rej){
        var t=db.transaction('f',mode),r=fn(t.objectStore('f'));
        t.oncomplete=function(){res(r&&r.result);};
        t.onerror=t.onabort=function(){rej(t.error);};
      });});
    };
    assets={
      upload:async function(file,o){
        o=o||{};
        var id=rid(),type=o.type||file.type||'application/octet-stream';
        try{await tx('readwrite',function(st){return st.put({blob:file.slice(0,file.size,type),name:file.name,type:type,folder:san(o.folder)||'Other'},id);});}
        catch(e){throw {code:'quota_or_state',message:String(e&&e.message||e)};}
        try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
        return {id:id,contentType:type,sizeBytes:file.size};
      },
      delete:async function(id){try{await tx('readwrite',function(st){return st.delete(id);});}catch(e){}}
    };
    blobUrl=async function(id){
      if(urlCache[id])return urlCache[id];
      var rec=await tx('readonly',function(st){return st.get(id);});
      if(!rec)throw new Error('missing');
      return (urlCache[id]=URL.createObjectURL(rec.blob));
    };
    window.PercyNative.open=async function(id){
      try{
        var u=await blobUrl(id);
        var w=window.open(u,'_blank');
        if(!w){var a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();}
      }catch(e){alert('This file is not on this phone any more.');}
    };
    downloads={
      save:async function(req){
        var name=san(req.filename)||'percy-file',data=req.data;
        var blob=data instanceof Blob?data:new Blob([data]);
        var file=null;try{file=new File([blob],name,{type:blob.type||(/\.json$/.test(name)?'application/json':/\.csv$/.test(name)?'text/csv':'application/octet-stream')});}catch(e){}
        if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
          try{await navigator.share({files:[file],title:name});return {status:'saved'};}
          catch(e){if(e&&e.name==='AbortError')throw {code:'declined'};}
        }
        var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(u);},4000);
        return {status:'saved',where:'your Downloads'};
      }
    };
    if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
      window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
    }
  }

  /* thumbnails: <img data-blob="id"> */
  function hydrate(){
    Array.prototype.forEach.call(document.querySelectorAll('img[data-blob]:not([src])'),function(im){
      blobUrl(im.getAttribute('data-blob')).then(function(u){im.src=u;}).catch(function(){});
    });
  }
  document.addEventListener('DOMContentLoaded',function(){
    hydrate();
    new MutationObserver(hydrate).observe(document.body,{childList:true,subtree:true});
  });

  /* reading confirmations: the user's own Anthropic API key */
  var MODEL='claude-sonnet-5-5';
  function parseJSONLoose(t){
    try{return JSON.parse(t);}catch(e){}
    var m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1]);}catch(e){}}
    var a=t.search(/[\[{]/),z=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));
    if(a>=0&&z>a){try{return JSON.parse(t.slice(a,z+1));}catch(e){}}
    throw {code:'invalid_json',message:'no JSON',text:t};
  }
  var sample=function(){return Promise.reject({code:'not_declared',message:'use sample.json'});};
  sample.nativePdf=true;
  sample.limits=async function(){return {maxPromptBytes:262144,images:{maxCount:5,maxInputBytes:20971520,mediaTypes:['image/jpeg','image/png','image/webp','image/gif']}};};
  sample.json=async function(prompt,opts){
    opts=opts||{};
    var key='';try{key=(localStorage.getItem('percy.apikey')||'').trim();}catch(e){}
    if(!key)throw {code:'no_key',message:'no api key'};
    var blobs=opts.images?(Array.isArray(opts.images)?opts.images:[opts.images]):[];
    var content=[];
    for(var i=0;i<blobs.length;i++){
      var b=blobs[i],t=b.type||'';
      if(t==='application/pdf')content.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:await b64(b)}});
      else content.push({type:'image',source:{type:'base64',media_type:/^image\/(jpeg|png|webp|gif)$/.test(t)?t:'image/jpeg',data:await b64(b)}});
    }
    content.push({type:'text',text:prompt+'\n\nReply with only the JSON value, no other text.'});
    var resp;
    try{
      resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,
        headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:MODEL,max_tokens:4096,messages:[{role:'user',content:content}]})});
    }catch(e){
      if(e&&e.name==='AbortError')throw {code:'cancelled',message:'cancelled'};
      throw {code:'offline',message:String(e&&e.message||e)};
    }
    if(resp.status===401||resp.status===403)throw {code:'bad_key',message:'status '+resp.status};
    if(resp.status===429)throw {code:'rate_limited',message:'status 429'};
    var j=null;try{j=await resp.json();}catch(e){}
    if(!resp.ok)throw {code:'upstream_error',message:'status '+resp.status+(j&&j.error&&j.error.message?': '+j.error.message:'')};
    var text=((j&&j.content)||[]).filter(function(c){return c.type==='text';}).map(function(c){return c.text;}).join('\n');
    if(!text.trim())throw {code:'empty_completion',message:'empty'};
    return parseJSONLoose(text);
  };
  var table={assets:assets,downloads:downloads,sample:sample};
  window.claude={use:function(n){return Promise.resolve(table[n]||null);}};
})();

</script>

var S={ready:false,mode:'loading',items:new Map(),tab:'today',trip:null,tripTab:'plan',vaultCat:'all',moneyView:'list',range:90,calY:0,calM:0,calSel:null,more:null,taxFY:null,recFilter:'all',err:'',reveal:new Set(),form:null,sheetMode:null};

var LS_KEY='lap.items.v1';

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

var Store={
  col:null,local:false,
  async init(){
    var w=window.claude;
    var pdb=w&&w.use?w.use('db').catch(function(){return null;}):Promise.resolve(null);
    var pas=w&&w.use?w.use('assets').catch(function(){return null;}):Promise.resolve(null);
    var pdl=w&&w.use?w.use('downloads').catch(function(){return null;}):Promise.resolve(null);
    var psm=w&&w.use?w.use('sample').catch(function(){return null;}):Promise.resolve(null);
    var db=await pdb;
    if(db){
      caps.db=db;this.col=db.collection('items');
      this.col.onSnapshot(function(snap){
        var m=new Map();
        snap.docs.forEach(function(d){if(d.exists)m.set(d.id,Object.assign({},d.data()));});
        S.items=m;S.ready=true;S.mode='cloud';S.err='';renderAll();
      },function(err){S.err='Live sync stopped ('+((err&&err.code)||'error')+'). Reload to reconnect.';renderAll();});
    }else{
      this.local=true;
      try{var raw=lsGet(LS_KEY);if(raw){var o=JSON.parse(raw);S.items=new Map(Object.keys(o).map(function(k){return [k,o[k]];}));}}catch(e){}
      S.ready=true;S.mode='local';renderAll();
    }
    caps.assets=await pas;caps.downloads=await pdl;
    caps.sample=await psm;
    if(caps.sample&&caps.sample.limits){try{var lim=await caps.sample.limits();caps.imgOK=!!(lim&&lim.images);}catch(e){caps.imgOK=false;}}
    renderAll();
  },
  persist(){var o={};S.items.forEach(function(v,k){o[k]=v;});lsSet(LS_KEY,JSON.stringify(o));},
  async save(id,obj){
    var clean={};Object.keys(obj).forEach(function(k){var v=obj[k];if(v===''||v==null||(Array.isArray(v)&&!v.length))return;clean[k]=v;});
    S.items.set(id,clean);
    if(this.local)this.persist();else await this.col.doc(id).set(clean);
    renderAll();
  },
  async del(id){
    S.items.delete(id);
    if(this.local)this.persist();else await this.col.doc(id).delete();
    renderAll();
  }
};

function mkEv(o){var T=today();var n=o.date?diffDays(o.date,T):null;return Object.assign({},o,{n:n,tone:n==null?'calm':tone(n,o.lead||0)});}
function buildEvents(){
  var T=today(),ev=[];
  function push(o){if(!o.date)return;var e=mkEv(o);if(e.n<0&&!o.late)return;ev.push(e);}
  var trips={};list('trip').forEach(function(t){trips[t.id]=t;});
  list('trip').forEach(function(t){push({ico:'plane',title:t.name,sub:'Trip starts'+(t.dest?' · '+t.dest:''),date:pd(t.start),lead:45,trip:t.id});});
  list('booking').forEach(function(b){var t=trips[b.tripId],bt=BTYPES[b.type]||BTYPES.other;push({ico:bt.ico,title:b.title,sub:bt.label+(t?' · '+t.name:''),date:pd(b.date),lead:7,open:['booking',b.id]});});
  list('ttask').filter(function(t){return !t.done&&t.date;}).forEach(function(t){var tr=trips[t.tripId];push({ico:'check',title:t.title,sub:'Trip task'+(tr?' · '+tr.name:''),date:pd(t.date),lead:7,late:true,lateWord:'Overdue',open:['ttask',t.id]});});
  list('doc').forEach(function(d){var c=DOC_CATS[d.cat]||DOC_CATS.other;var lead=d.remind!=null&&d.remind!==''?Number(d.remind):c.lead;push({ico:c.ico,title:d.title+' expires',sub:[c.label,d.holder].filter(Boolean).join(' · '),date:pd(d.expiry),lead:lead,late:true,lateWord:'Expired',open:['doc',d.id]});});
  list('pay').forEach(function(p){
    var a=pd(p.date);if(!a)return;var c=PAY_CATS[p.cat]||PAY_CATS.other;var f=p.freq||'monthly';
    push({ico:c.ico,title:p.name,sub:[c.label,(FREQ[f]||{}).label,money(p.amount)].filter(Boolean).join(' · '),date:nextOcc(a,f,T),lead:3,late:true,lateWord:'Overdue',open:['pay',p.id]});
    if(p.trialEnd)push({ico:'alert',title:p.name+' free trial ends',sub:'Cancel before it bills',date:pd(p.trialEnd),lead:7,open:['pay',p.id]});
  });
  var lease=list('lease')[0];
  if(lease&&pd(lease.end)){
    push({ico:'house',title:'Lease ends',sub:lease.place||'Your rental',date:pd(lease.end),lead:90,tab:'home'});
    list('ltask').filter(function(t){return !t.done;}).forEach(function(t){push({ico:'check',title:t.title,sub:'End of lease',date:addDays(pd(lease.end),-(Number(t.offset)||0)),lead:14,late:true,lateWord:'Overdue',open:['ltask',t.id]});});
  }
  list('vehicle').forEach(function(v){var lead=v.remind!=null&&v.remind!==''?Number(v.remind):30;push({ico:'car',title:(VEH_CATS[v.cat]||'Reminder')+(v.vehicle?' · '+v.vehicle:''),sub:'Vehicle',date:pd(v.date),lead:lead,late:true,lateWord:'Overdue',open:['vehicle',v.id]});});
  list('receipt').forEach(function(r){push({ico:'receipt',title:r.title+' warranty ends',sub:r.store||'Receipt',date:pd(r.warrantyEnd),lead:30,open:['receipt',r.id]});});
  ev.sort(function(a,b){return a.date-b.date||String(a.title).localeCompare(String(b.title));});
  return ev;
}

function ticketHTML(t,link){
  if(link===undefined)link=true;
  var T=today(),s=pd(t.start),e=pd(t.end);if(!s||!e)return '';
  var total=diffDays(e,s)+1,status;
  if(T<s){var n=diffDays(s,T);status=n===1?'Starts tomorrow':n+' days to go';}
  else if(T<=e){status='Day '+(diffDays(T,s)+1)+' of '+total;}
  else{status='Finished';}
  var count=list('booking').filter(function(b){return b.tripId===t.id;}).length;
  return '<div class="ticket"'+(link?' role="button" tabindex="0" data-go="trips" data-trip="'+t.id+'"':'')+'><div class="ticket-main"><h3>'+esc(t.name)+'</h3>'+(t.dest?'<span class="sub">'+esc(t.dest)+'</span>':'')+'<span class="dates">'+esc(fd(s,'short'))+' to '+esc(fd(e,'med'))+' · '+total+' days · '+count+' plan'+(count===1?'':'s')+'</span></div><div class="ticket-stub"><b>'+esc(status)+'</b></div></div>';
}

function moneyCal(pays){
  var T=today();
  if(!S.calY){S.calY=T.getFullYear();S.calM=T.getMonth();}
  var ms=new Date(S.calY,S.calM,1,12),me=new Date(S.calY,S.calM+1,0,12),dim=me.getDate();
  var byDay={},total=0;
  pays.forEach(function(p){var a=pd(p.date);if(!a)return;occRange(a,p.freq||'monthly',ms,me).forEach(function(o){var k=ymd(o);(byDay[k]=byDay[k]||[]).push(p);total+=Number(p.amount)||0;});});
  var lead=(ms.getDay()+6)%7;
  var h='<div class="calhead"><button class="icon-btn" type="button" data-act="calnav" data-v="-1" aria-label="Previous month">'+ic('back')+'</button><div style="text-align:center"><h3>'+esc(fd(ms,'month'))+'</h3><span class="sub">'+esc(money(Math.round(total)))+' due this month</span></div><button class="icon-btn" type="button" data-act="calnav" data-v="1" aria-label="Next month">'+ic('next')+'</button></div>';
  h+='<div class="cal" role="grid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(d){return '<div class="dow">'+d+'</div>';}).join('');
  for(var i=0;i<lead;i++)h+='<div class="day blank"></div>';
  if(!S.calSel&&S.calY===T.getFullYear()&&S.calM===T.getMonth())S.calSel=ymd(T);
  var sel=S.calSel;
  for(var d=1;d<=dim;d++){
    var dt=new Date(S.calY,S.calM,d,12),k=ymd(dt),arr=byDay[k]||[];
    var cls='day'+(k===ymd(T)?' today':'')+(k===sel?' sel':'');
    h+='<button type="button" class="'+cls+'" data-act="calday" data-d="'+k+'" aria-label="'+esc(fd(dt,'long'))+(arr.length?', '+arr.length+' due':'')+'">'+d+'<span class="dots">'+arr.slice(0,3).map(function(p){return '<i style="background:var('+(PAY_CATS[p.cat]||PAY_CATS.other).c+')"></i>';}).join('')+'</span></button>';
  }
  h+='</div>';
  if(sel&&byDay[sel]){
    h+='<div class="group-h">'+esc(fd(pd(sel),'long'))+'</div><div class="board">'+byDay[sel].map(function(p){var c=PAY_CATS[p.cat]||PAY_CATS.other;return '<div class="brow" role="button" tabindex="0" data-open="pay:'+p.id+'"><span class="ico">'+ic(c.ico)+'</span><span class="bmain"><b>'+esc(p.name)+'</b><span class="sub">'+esc(c.label)+'</span></span><span class="when"><b>'+esc(money(p.amount)||'—')+'</b></span></div>';}).join('')+'</div>';
  }else h+='<p class="note">'+(sel?'Nothing due on '+esc(fd(pd(sel),'long'))+'.':'Tap a day to see what is due.')+'</p>';
  return h;
}

function fileKind(file){
  var t=file.type||'',n=(file.name||'').toLowerCase();
  if(/^image\/(png|jpeg|webp|gif)$/.test(t)||t==='application/pdf')return t;
  if(/\.pdf$/.test(n))return 'application/pdf';
  if(/\.(jpe?g)$/.test(n))return 'image/jpeg';
  if(/\.png$/.test(n))return 'image/png';
  if(/\.webp$/.test(n))return 'image/webp';
  if(/\.gif$/.test(n))return 'image/gif';
  return null;
}
async function saveForm(){
  var f=S.form;if(!f||f.busy)return;
  var F=FORMS[f.kind],form=$('#sheetForm'),data=new FormData(form),obj=Object.assign({},f.item);
  var missing=null;
  F.fields.forEach(function(fl){
    if(fl.t==='files')return;
    var v=data.get(fl.k);
    if(fl.t==='toggle'){obj[fl.k]=!!v;return;}
    if(fl.t==='number'){obj[fl.k]=(v===''||v==null)?null:Number(v);return;}
    obj[fl.k]=String(v==null?'':v).trim();
    if(fl.req&&!obj[fl.k]&&!missing)missing=fl.l;
  });
  if(missing){toast('Fill in: '+missing);return;}
  if(f.kind==='trip'&&obj.start&&obj.end&&obj.end<obj.start){toast('The end date is before the start date.');return;}
  f.busy=true;var btn=$('#saveBtn');btn.disabled=true;btn.textContent=f.pending.length?'Uploading…':'Saving…';
  try{
    var uploaded=[];
    for(var i=0;i<f.pending.length;i++){
      var file=f.pending[i],type=fileKind(file);
      var r=await caps.assets.upload(file,{type:type,folder:folderFor(Object.assign({kind:f.kind},obj))});
      uploaded.push({id:r.id,name:file.name,type:r.contentType,size:r.sizeBytes});
    }
    var hasFiles=F.fields.some(function(x){return x.t==='files';});
    if(hasFiles)obj.files=f.files.concat(uploaded);
    var id=f.id||gid(f.kind);
    if(!f.id)obj.createdAt=new Date().toISOString();
    obj.kind=f.kind;delete obj.id;
    await Store.save(id,obj);
    if(f.removed.length&&caps.assets){f.removed.forEach(function(x){caps.assets.delete(x.id).catch(function(){});});}
    var wasNewTrip=f.kind==='trip'&&!f.id;
    closeSheet();toast('Saved');
    if(wasNewTrip){S.tab='trips';S.trip=id;S.tripTab='plan';lsSet('lap.tab','trips');renderAll();window.scrollTo(0,0);}
  }catch(err){
    f.busy=false;btn.disabled=false;btn.textContent='Save';
    var code=err&&err.code;
    toast(code==='unsupported_type'?'That file type is not supported. Use PDF, JPG or PNG.':code==='too_large'?'A file is over 20 MB.':code==='quota_or_state'?'Storage is full.':'Could not save. Try again.');
  }
}
async function doDelete(){
  var f=S.form;if(!f||!f.id)return;

}

var PDFJS_V='3.11.174',pdfjsP=null;
function loadPdfjs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(pdfjsP)return pdfjsP;
  pdfjsP=new Promise(function(res,rej){
    var sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_V+'/pdf.min.js';
    sc.onload=function(){var l=window.pdfjsLib;if(!l){pdfjsP=null;rej(new Error('pdfjs'));return;}l.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_V+'/pdf.worker.min.js';res(l);};
    sc.onerror=function(){pdfjsP=null;rej(new Error('pdfjs'));};
    document.head.appendChild(sc);
    setTimeout(function(){if(!window.pdfjsLib){pdfjsP=null;rej(new Error('pdfjs'));}},15000);
  });
  return pdfjsP;
}
async function pdfToInput(file){
  var lib=await loadPdfjs();
  var doc=await Promise.race([lib.getDocument({data:await file.arrayBuffer()}).promise,new Promise(function(_,rj){setTimeout(function(){rj(new Error('pdfjs'));},30000);})]);
  var text='',n=Math.min(doc.numPages,10);
  for(var i=1;i<=n;i++){
    var pg=await doc.getPage(i),tc=await pg.getTextContent();
    text+=tc.items.map(function(it){return it.str+(it.hasEOL?'\n':' ');}).join('')+'\n';
  }
  if(text.replace(/\s/g,'').length>=60)return {text:text.slice(0,60000),images:[]};
  var imgs=[];
  for(var j=1;j<=Math.min(doc.numPages,3);j++){
    var pg2=await doc.getPage(j),vp=pg2.getViewport({scale:1.6});
    var cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
    await pg2.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    var blob=await new Promise(function(r){cv.toBlob(r,'image/jpeg',0.85);});
    if(blob)imgs.push(blob);
  }
  return {text:'',images:imgs};
}

      body+='</section>';
    });
    body+='<p class="note">Check the details against your confirmation. The original file is attached to each booking.</p>';
    foot='<button class="btn" type="button" data-act="impBack">Back</button><button class="btn primary" type="button" data-act="impAdd" id="impAddBtn"'+(n?'':' disabled')+'>Add '+n+' to trip</button>';
  }
  openSheet('Import a confirmation',body,foot,'import');
}
function impListHTML(){
  var I=S.imp;
  return I.srcs.filter(function(x){return x.file;}).map(function(x,i){return '<div class="file-row"><span class="thumb">'+ic('clip',20)+'</span><span style="min-width:0"><span style="font-weight:600;overflow-wrap:anywhere">'+esc(x.name)+'</span><span class="sub">'+esc(bytes(x.file.size))+'</span></span><button class="rm" type="button" data-act="impRm" data-i="'+i+'" aria-label="Remove '+esc(x.name)+'">'+ic('x',18)+'</button></div>';}).join('');
}
function impCount(){var n=0;S.imp.srcs.forEach(function(x){(x.items||[]).forEach(function(r){if(r.incl)n++;});});return n;}
function impErr(e){return impErr0(e)+' ['+String((e&&(e.code||e.message))||'unknown').slice(0,60)+']';}
function impErr0(e){
  var c=e&&e.code;
  return c==='no_key'?'Add your Anthropic API key first: More, then Backup & data.'
    :c==='bad_key'?'The API key was not accepted. Check it in More, then Backup & data.'
    :c==='offline'?'No internet connection. Connect and try again.'
    :c==='not_granted'?'You chose not to allow Claude to read this. You can still add the booking by hand.'
    :c==='rate_limited'?'Too many requests right now. Wait a minute and try again.'
    :c==='session_expired'?'Sign in to Claude again, then retry.'
    :c==='image_rejected'?'That image could not be read. Try a PDF or a clearer screenshot.'
    :c==='images_unavailable'?'Reading images is not available in this view. Try a PDF, or paste the text.'
    :c==='invalid_json'?'Could not make sense of the result. Try again, or add it by hand.'
    :c==='sampling_disabled'||c==='capability_disabled'||c==='not_declared'?'Claude is not available for this account here.'
    :(e&&e.message==='pdfjs')?'Could not open this PDF here. Try a screenshot of it, or paste the text.'
    :'Something went wrong reading it. Try again.';
}
async function impRun(){
  var I=S.imp;if(!I||I.busy)return;
  var ta=$('#impText');if(ta)I.text=ta.value;
  var txt=(I.text||'').trim();
  I.srcs=I.srcs.filter(function(x){return x.file;});
  if(txt)I.srcs.push({name:'Pasted text',file:null,text:txt});
  if(!I.srcs.length){toast('Choose a file or paste some text first.');return;}
  I.srcs.forEach(function(x){x.status='waiting';x.items=null;x.err=null;});
  I.busy=true;I.stage='reading';I.ctl=new AbortController();impRender();
  var ctl=I.ctl;
  for(var i=0;i<I.srcs.length;i++){
    var x=I.srcs[i];
    if(ctl.signal.aborted)break;
    try{
      var content='',images=[];
      x.step='Opening the file…';impRender();
      if(!x.file){content='Confirmation text:\n'+x.text.slice(0,60000);}
      else if(fileKind(x.file)==='application/pdf'){
        var pi=caps.sample.nativePdf?{text:'',images:[x.file]}:await pdfToInput(x.file);
        if(pi.text)content='Text of the PDF "'+x.name+'":\n'+pi.text;
        else{images=pi.images;content='The attached images are the pages of the PDF "'+x.name+'".';}
      }else{images=[x.file];content='The attached image is a booking confirmation or a screenshot of one.';}
      if(images.length&&!caps.imgOK)throw {code:'images_unavailable'};
      x.step='Asking Claude. Allow it if a prompt appears…';impRender();
      var opts={signal:ctl.signal};
      if(images.length)opts.images=images;
      var out=await caps.sample.json(impPrompt(content),opts);
      var arr=Array.isArray(out)?out:(out&&Array.isArray(out.bookings)?out.bookings:(out&&typeof out==='object'?[out]:[]));
      x.items=arr.slice(0,12).map(impClean).filter(function(r){return r.title||r.date;}).map(function(r){r.dup=impIsDup(r);r.outside=impOutside(r);r.incl=!r.dup;return r;});
      if(!x.items.length&&x.file){x.items=[{type:'other',title:x.name.replace(/\.[^.]+$/,''),date:'',time:'',endDate:'',where:'',ref:'',notes:'',placeholder:true,incl:true}];}
      x.status='done';
    }catch(e){
      if(e&&e.code==='cancelled'){break;}
      x.status='error';x.err=impErr(e);x.items=x.items||[];
      if(e&&(e.code==='not_granted'||e.code==='sampling_disabled'||e.code==='capability_disabled'||e.code==='not_declared'||e.code==='session_expired'||e.code==='no_key'||e.code==='bad_key')){
        for(var k=i+1;k<I.srcs.length;k++){I.srcs[k].status='error';I.srcs[k].err=x.err;I.srcs[k].items=[];}
        break;
      }
    }
  }
  I.busy=false;I.ctl=null;
  if(!S.imp||S.imp!==I)return;
  if(ctl.signal.aborted){I.stage='pick';I.srcs=I.srcs.filter(function(x){return x.file;});impRender();return;}
  I.stage='review';impRender();
}
async function impAdd(){
  var I=S.imp;if(!I||I.busy)return;
  I.busy=true;var btn=$('#impAddBtn');if(btn){btn.disabled=true;btn.textContent='Saving…';}
  var added=0;
  try{
    for(var si=0;si<I.srcs.length;si++){
      var x=I.srcs[si],file=null;
      for(var ii=0;ii<(x.items||[]).length;ii++){
        var r=x.items[ii];if(!r.incl)continue;
        if(x.file&&!file){
          var up=await caps.assets.upload(x.file,{type:fileKind(x.file),folder:folderFor({kind:'booking',tripId:I.tripId})});
          file={id:up.id,name:x.file.name,type:up.contentType,size:up.sizeBytes};
        }
        var obj={kind:'booking',tripId:I.tripId,type:r.type,title:r.title,date:r.date,time:r.time,endDate:r.endDate,where:r.where,ref:r.ref,notes:r.notes,createdAt:new Date().toISOString()};
        if(file)obj.files=[file];
        await Store.save(gid('booking'),obj);added++;
      }
    }
    S.imp=null;closeSheet();S.tripTab='plan';renderAll();toast('Added '+added+' to your trip');
  }catch(e){
    I.busy=false;if(btn){btn.disabled=false;btn.textContent='Add '+impCount()+' to trip';}
    var c=e&&e.code;
    toast(added?'Added '+added+', then something failed. Check the trip, then retry.':(c==='too_large'?'A file is over 20 MB.':'Could not save. Try again.'));
    renderAll();
  }
}
var delTimer=null;
var A={
  tab:function(el){go(el.dataset.v);},
  openfile:function(el){if(window.PercyNative)window.PercyNative.open(el.dataset.id,el.dataset.type);},
  saveKey:function(){var i=$('#apiKey'),v=(i&&i.value||'').trim();if(!v){toast('Paste your key first.');return;}lsSet('percy.apikey',v);i.value='';toast('Key saved on this phone.');renderAll();},
  impOpen:function(el){impOpen(el.dataset.trip);},
  impRun:function(){impRun();},
  impStop:function(){if(S.imp&&S.imp.ctl)S.imp.ctl.abort();},
  impBack:function(){if(S.imp){S.imp.stage='pick';S.imp.srcs=S.imp.srcs.filter(function(x){return x.file;});impRender();}},
  impAdd:function(){impAdd();},
  impRm:function(el){var I=S.imp;if(!I)return;var files=I.srcs.filter(function(x){return x.file;});var x=files[Number(el.dataset.i)];I.srcs=I.srcs.filter(function(y){return y!==x;});$('#impList').innerHTML=impListHTML();},
  impEdit:function(el){
    var I=S.imp;if(!I)return;var x=I.srcs[Number(el.dataset.s)],r=x&&x.items[Number(el.dataset.i)];if(!r)return;
    var tripId=I.tripId,file=x.file;
    S.imp=null;closeSheet();
    openForm('booking',null,{tripId:tripId,type:r.type,title:r.title,date:r.date,time:r.time,endDate:r.endDate,where:r.where,ref:r.ref,notes:r.notes});
    if(file&&S.form){S.form.pending.push(file);var fl=$('#fileList');if(fl)fl.innerHTML=filesHTML();}
  },
  go:function(el){go(el.dataset.v);},
  search:function(){openSearch();},
  fab:function(){openAddMenu();},
  closeSheet:function(){closeSheet();},
  add:function(el){var p=null;try{p=el.dataset.preset?JSON.parse(el.dataset.preset):null;}catch(e){}openForm(el.dataset.kind,null,p);},
  range:function(el){S.range=Number(el.dataset.v);renderAll();},
  vcat:function(el){S.vaultCat=el.dataset.v;renderAll();},
  mview:function(el){S.moneyView=el.dataset.v;renderAll();},
  rfilter:function(el){S.recFilter=el.dataset.v;renderAll();},
  fy:function(el){S.taxFY=Number(el.dataset.v);renderAll();},
  more:function(el){S.more=el.dataset.v||null;renderAll();window.scrollTo(0,0);},
  tripBack:function(){S.trip=null;renderAll();window.scrollTo(0,0);},
  tripTab:function(el){S.tripTab=el.dataset.v;renderAll();},
  calnav:function(el){var d=new Date(S.calY,S.calM+Number(el.dataset.v),1,12);S.calY=d.getFullYear();S.calM=d.getMonth();S.calSel=null;renderAll();},
  calday:function(el){S.calSel=el.dataset.d;renderAll();},
  reveal:function(el){var id=el.dataset.id;if(S.reveal.has(id))S.reveal.delete(id);else S.reveal.add(id);renderAll();},
  copy:function(el){copyText(el.dataset.v);},
  tgl:async function(el){var it=S.items.get(el.dataset.id);if(!it)return;try{await Store.save(el.dataset.id,Object.assign({},it,{done:!it.done}));}catch(e){toast('Could not update.');}},
  starterLease:function(){addStarter('lease');},
  starterTrip:function(){addStarter('trip');},
  rmfile:function(el){var f=S.form;if(!f)return;var x=f.files.splice(Number(el.dataset.i),1)[0];if(x)f.removed.push(x);$('#fileList').innerHTML=filesHTML();},
  rmpend:function(el){var f=S.form;if(!f)return;f.pending.splice(Number(el.dataset.i),1);$('#fileList').innerHTML=filesHTML();},
  delAsk:function(el){
    var f=S.form;if(!f)return;
    if(!f.confirmDel){f.confirmDel=true;var extra=f.kind==='trip'?'trip and its plans':'item';el.innerHTML=ic('trash',18)+'Tap again to delete';el.style.flex='1 1 auto';clearTimeout(delTimer);delTimer=setTimeout(function(){if(S.form&&$('#delBtn')){S.form.confirmDel=false;$('#delBtn').innerHTML=ic('trash',18)+'Delete';$('#delBtn').style.flex='0 0 auto';}},4000);return;
    }
    doDelete();
  },
  export:function(){saveFile('percy-backup-'+ymd(today())+'.json',JSON.stringify({app:'percy',version:1,exportedAt:new Date().toISOString(),items:Object.fromEntries(S.items)},null,2));},
  importPick:function(){var i=$('#importInput');if(i)i.click();},
  taxcsv:function(){
    var rows=taxItems().filter(function(r){return fyOf(pd(r.date))===S.taxFY;}).sort(function(a,b){return String(a.date).localeCompare(String(b.date));});
    var csv=['Date,Item,Store,Amount,Note'].concat(rows.map(function(r){return [r.date,r.title,r.store,r.amount,r.taxNote].map(csvCell).join(',');})).join('\n');
    saveFile('tax-receipts-'+fyLabel(S.taxFY).replace(/\s/g,'-').replace('–','-')+'.csv',csv);
  }
};

document.addEventListener('click',function(e){
  if(e.target===$('#scrim')){closeSheet();return;}
  var an=e.target.closest('a[href]');if(an&&!an.dataset.act)return;
  var el=e.target.closest('[data-act],[data-open],[data-go]');if(!el)return;
  if(el.dataset.act){var fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el,e);}return;}
  if(el.dataset.open){var p=el.dataset.open.split(':');openForm(p[0],p[1]);return;}
  if(el.dataset.go){
    var tab=el.dataset.go;S.tab=tab;S.reveal=new Set();S.more=null;
    S.trip=tab==='trips'&&el.dataset.trip?el.dataset.trip:null;if(S.trip)S.tripTab='plan';
    lsSet('lap.tab',tab);if(!$('#scrim').hidden)closeSheet();renderAll();window.scrollTo(0,0);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#scrim').hidden){closeSheet();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='fileInput'&&S.form){
    Array.prototype.forEach.call(t.files,function(file){
      if(!fileKind(file)){toast('Unsupported file: '+file.name+'. Use PDF, JPG or PNG (HEIC is not supported).');return;}
      if(file.size>20*1048576){toast(file.name+' is over 20 MB.');return;}
      S.form.pending.push(file);
    });
    t.value='';$('#fileList').innerHTML=filesHTML();
  }
  if((t.id==='impFile'||t.id==='impCam')&&S.imp){
    Array.prototype.forEach.call(t.files,function(file){
      if(!fileKind(file)){toast('Unsupported file: '+file.name+'. Use PDF, JPG or PNG (HEIC is not supported).');return;}
      if(file.size>20*1048576){toast(file.name+' is over 20 MB.');return;}
      S.imp.srcs.push({name:file.name,file:file});
    });
    t.value='';$('#impList').innerHTML=impListHTML();
  }
  if(t.matches&&t.matches('input[data-imp]')&&S.imp){var q=t.dataset.imp.split(':'),rr=S.imp.srcs[+q[0]].items[+q[1]];rr.incl=t.checked;var ab=$('#impAddBtn');if(ab){var c=impCount();ab.textContent='Add '+c+' to trip';ab.disabled=!c;}}
  if(t.id==='importInput'&&t.files&&t.files[0]){importBackup(t.files[0]);t.value='';}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var form=e.target;
  if(form.id==='sheetForm'){if(S.sheetMode==='form')saveForm();return;}
  if(form.dataset.form==='addTtask'){
    var inp=$('#newTtask'),v=(inp.value||'').trim();if(!v||!S.trip)return;
    inp.value='';Store.save(gid('ttask'),{kind:'ttask',tripId:S.trip,title:v}).catch(function(){toast('Could not add.');});
  }
});

/* ---------- boot ---------- */
(function boot(){
  $('#searchBtn').innerHTML=ic('search',22);$('#closeBtn').innerHTML=ic('x',22);$('#fab').innerHTML=ic('plus',26);
  var t=lsGet('lap.tab');if(t&&TABS.some(function(x){return x[0]===t;}))S.tab=t;
  renderAll();
  Store.init();
})();
})();
</script>
